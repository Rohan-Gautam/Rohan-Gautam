name: Generate GitHub Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v6

      # ==========================================
      # Prepare output directory
      # ==========================================
      - name: Prepare dist directory
        run: |
          rm -rf dist
          mkdir -p dist

      # ==========================================
      # GitHub Stats
      # ==========================================
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Rohan-Gautam&show_icons=true&theme=tokyonight&hide_border=true&count_private=true
          path: dist/github-stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      # ==========================================
      # Top Languages
      # ==========================================
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Rohan-Gautam&layout=compact&theme=tokyonight&hide_border=true
          path: dist/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      # ==========================================
      # Activity Graph
      # Black background + green graph
      # ==========================================
      - name: Generate Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: Rohan-Gautam
          options: bg_color=000000&color=39d353&title_color=39d353&line=39d353&point=39d353&area_color=238636&area=true&hide_border=true
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      # ==========================================
      # GitHub Trophies
      # ==========================================
      - name: Generate GitHub Trophies
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: username=Rohan-Gautam&theme=tokyonight&no-frame=true&row=1&column=6
          path: dist/github-trophies.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      # ==========================================
      # Contribution Snake
      # ==========================================
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Rohan-Gautam
          github_token: ${{ secrets.GH_STATS_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # ==========================================
      # Show generated files
      # ==========================================
      - name: Verify generated assets
        run: |
          echo "Generated assets:"
          ls -lh dist/

      # ==========================================
      # Publish EVERYTHING to output branch
      # ==========================================
      - name: Publish all profile assets
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
